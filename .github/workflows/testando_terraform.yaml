name: testando_terraform
run-name: ${{ github.workflow }}-${{ github.run_id }}-${{ github.actor }}
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec (JSON output)
        run: |
          curl -sL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o tfsec
          chmod +x tfsec
          ./tfsec . --format json --out results.json --soft-fail

      - name: Build markdown summary
        run: |
          echo "### tfsec findings" > summary.md
          echo "" >> summary.md
          echo "| Rule | Severity | File | Line |" >> summary.md
          echo "|---|---|---|---|" >> summary.md
          jq -r '.results[] | "| \(.rule_id) | \(.severity) | \(.location.filename) | \(.location.start_line) |"' results.json >> summary.md

      - name: Post/update sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md